services:
  webapp:
    build: .
    ports:
      # Loopback only: Caddy is the public entry point (see docker-compose.caddy.yml).
      - "127.0.0.1:8080:8080"
    volumes:
      - ./instance:/app/instance
      - ./secrets/admin_password_hash:/run/secrets/admin_password_hash:ro
    environment:
      # app.py reads SECRET_KEY, not FLASK_SECRET_KEY. The old FLASK_SECRET_KEY
      # default was silently ignored, leaving the hardcoded fallback in app.py:9
      # active. Required now, because a known key lets anyone forge session cookies.
      # Set to 0 only for local testing over plain HTTP; the session cookie will
      # not be sent back otherwise and login appears to loop.
      - ADMIN_COOKIE_SECURE=${ADMIN_COOKIE_SECURE:-1}
      #- SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      - DATABASE_URL=sqlite:///instance/evaluations.db
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8080), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  # Created once: docker network create caddy-proxy
  # The Caddy container serving enip-human.duckdns.org must join it too, so that
  # `reverse_proxy webapp:8080` resolves. Nothing else needs to be published:
  # the 127.0.0.1:8080 mapping below is for host-side debugging only.
  proxy:
    external: true
    name: caddy-proxy
