# DEV/LOCAL ONLY. Production integrates into the Caddy that already owns :80/:443
# on the VPS, by having that Caddyfile `import ./Caddyfile.site`.
#
# Deliberately published on :8090, NOT :80/:443, so it cannot fight the Caddy that
# already holds those ports on the server.
#
#   docker network create caddy-proxy      # once
#   cp .env.example .env                   # fill SECRET_KEY
#   docker compose build webapp            # else BuildKit progress lands in the hash file
#   mkdir -p secrets
#   docker compose run --rm --entrypoint python webapp -c \
#     "import getpass;from werkzeug.security import generate_password_hash;print(generate_password_hash(getpass.getpass()))" \
#     > secrets/admin_password_hash
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# --entrypoint is required: the image ENTRYPOINT is entrypoint.sh, which ends in
# `exec gunicorn`, so a bare `compose run webapp python -c ...` never returns and
# leaves a 0-byte hash file behind. On PowerShell, `>` writes UTF-16 and the app
# will reject the hash -- use the non-interactive form in app.py instead.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      webapp:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8090}
      ACME_EMAIL: ${ACME_EMAIL:-bagas_wap@outlook.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Required: Caddyfile does `import Caddyfile.site`. Without this mount the
      # import fails and the container crash-loops on `restart: unless-stopped`.
      - ./Caddyfile.site:/etc/caddy/Caddyfile.site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

volumes:
  caddy_data:
  caddy_config:

networks:
  proxy:
    external: true
    name: caddy-proxy